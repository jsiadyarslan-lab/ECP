[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecp-protocol"
version = "0.2.0"
description = "ECP - Evidentiary Evaluation Protocol: provider-neutral foundation for cross-system evidentiary evaluation of AI systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["jsonschema>=4.18"]
keywords = ["evaluation", "protocol", "provenance", "reproducibility", "benchmarking"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["ecp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
